services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: golden_casino
      POSTGRES_USER: golden
      POSTGRES_PASSWORD: golden
    ports:
      - "5432:5432"
    volumes:
      - golden-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U golden -d golden_casino"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  golden-postgres-data:

